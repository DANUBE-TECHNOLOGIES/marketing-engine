name: MSE-GEO V1.11 Knowledge Admin GEO Foundation

on:
  pull_request:
    paths:
      - "frontend/lib/knowledge/geo-admin-options.js"
      - "frontend/app/knowledge/page.js"
      - "frontend/app/knowledge/[id]/page.js"
      - "frontend/app/knowledge/[id]/RelationManager.js"
      - "frontend/test/mse-geo-v1-11-knowledge-admin-geo-foundation.test.mjs"
      - ".github/workflows/mse-geo-v1-11.yml"

jobs:
  admin-geo-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-geo-v1-11-knowledge-admin-geo-foundation.test.mjs

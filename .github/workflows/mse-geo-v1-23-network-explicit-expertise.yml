name: MSE-GEO V1.23 Network Explicit Expertise

on:
  pull_request:
    paths:
      - "backend/src/knowledge/network-expertise.service.js"
      - "backend/src/knowledge/network-geo.routes.js"
      - "backend/test/mse-geo-v1-23-network-explicit-expertise.test.js"
      - "frontend/app/knowledge/geo/network/expertise/page.js"
      - "frontend/app/knowledge/geo/network/layout.js"
      - "frontend/test/mse-geo-v1-23-network-explicit-expertise.test.mjs"
      - ".github/workflows/mse-geo-v1-23-network-explicit-expertise.yml"
  workflow_dispatch:

jobs:
  backend-explicit-expertise:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run explicit expertise and inherited GEO contracts
        run: |
          node --test test/mse-geo-v1-23-network-explicit-expertise.test.js
          node --test test/mse-geo-v1-20-network-team-knowledge-link.test.js
          node --test test/mse-geo-v1-19-controlled-knowledge-apply.test.js

  frontend-explicit-expertise:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run expertise and network UI contracts
        run: |
          node --test test/mse-geo-v1-23-network-explicit-expertise.test.mjs
          node --test test/mse-geo-v1-21-network-public-readiness.test.mjs
          node --test test/mse-geo-v1-20-network-team-knowledge-link.test.mjs

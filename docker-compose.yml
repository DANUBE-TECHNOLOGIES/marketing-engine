services:
  postgres:
    image: postgres:16
    container_name: mle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    image: node:22
    container_name: mle_backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: "development"
      DATABASE_URL: "${DATABASE_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_BUSINESS_ACCOUNT_ID: "${GOOGLE_BUSINESS_ACCOUNT_ID}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"
      DATAFORSEO_ENABLED: "${DATAFORSEO_ENABLED}"
      DATAFORSEO_LOGIN: "${DATAFORSEO_LOGIN}"
      DATAFORSEO_PASSWORD: "${DATAFORSEO_PASSWORD}"
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL}"
      PUBLIC_SITE_ORIGIN: "${PUBLIC_SITE_ORIGIN}"
      PUBLIC_INDEXABILITY_FETCH_ORIGIN: "${PUBLIC_INDEXABILITY_FETCH_ORIGIN:-http://frontend:3000}"
      TENANT_SLUG: "${TENANT_SLUG:-mondescale}"
      IDENTITY_HMAC_SECRET: "${IDENTITY_HMAC_SECRET}"
      IDENTITY_HMAC_MAX_AGE_MS: "${IDENTITY_HMAC_MAX_AGE_MS:-300000}"
      TRUST_IDENTITY_HEADERS: "false"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
        NEXT_PUBLIC_SITE_ORIGIN: "${NEXT_PUBLIC_SITE_ORIGIN}"
        NEXT_PUBLIC_TENANT_SLUG: "${NEXT_PUBLIC_TENANT_SLUG:-mondescale}"
        NEXT_PUBLIC_SHOWCASE_URL: "${NEXT_PUBLIC_SHOWCASE_URL:-https://mondescale.com}"
    image: mondescale-marketing-frontend:mse-25-3
    container_name: mle_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: "production"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_BUSINESS_ACCOUNT_ID: "${GOOGLE_BUSINESS_ACCOUNT_ID}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"
      BASIC_AUTH_USERNAME: "${BASIC_AUTH_USERNAME}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD}"
      IDENTITY_HMAC_SECRET: "${IDENTITY_HMAC_SECRET}"
      BACKEND_INTERNAL_URL: "http://backend:4000"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL}"
      NEXT_PUBLIC_SITE_ORIGIN: "${NEXT_PUBLIC_SITE_ORIGIN}"
      PUBLIC_SITE_ORIGIN: "${PUBLIC_SITE_ORIGIN}"
      NEXT_PUBLIC_TENANT_SLUG: "${NEXT_PUBLIC_TENANT_SLUG:-mondescale}"
      TENANT_SLUG: "${TENANT_SLUG:-mondescale}"
      NEXT_PUBLIC_SHOWCASE_URL: "${NEXT_PUBLIC_SHOWCASE_URL:-https://mondescale.com}"
      INTERNAL_FRONTEND_URL: "http://localhost:3000"

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16
    container_name: mle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: node:22
    container_name: mle_backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      default:
        aliases:
          - backend
      runtime: {}
    environment:
      NODE_ENV: "development"
      DATABASE_URL: "${DATABASE_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_BUSINESS_ACCOUNT_ID: "${GOOGLE_BUSINESS_ACCOUNT_ID}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"
      SEARCH_CONSOLE_ENABLED: "${SEARCH_CONSOLE_ENABLED:-false}"
      SEARCH_CONSOLE_SITE_URL: "${SEARCH_CONSOLE_SITE_URL:-}"
      SEARCH_CONSOLE_OAUTH_STATE_SECRET: "${SEARCH_CONSOLE_OAUTH_STATE_SECRET:-}"
      DATAFORSEO_ENABLED: "${DATAFORSEO_ENABLED}"
      DATAFORSEO_LOGIN: "${DATAFORSEO_LOGIN}"
      DATAFORSEO_PASSWORD: "${DATAFORSEO_PASSWORD}"
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL}"
      PUBLIC_SITE_ORIGIN: "${PUBLIC_SITE_ORIGIN}"
      PUBLIC_INDEXABILITY_FETCH_ORIGIN: "${PUBLIC_INDEXABILITY_FETCH_ORIGIN:-http://frontend:3000}"
      PUBLIC_INDEXABILITY_TIMEOUT_MS: "${PUBLIC_INDEXABILITY_TIMEOUT_MS:-15000}"
      PUBLIC_INDEXABILITY_CONCURRENCY: "${PUBLIC_INDEXABILITY_CONCURRENCY:-2}"
      TENANT_SLUG: "${TENANT_SLUG:-mondescale}"
      IDENTITY_HMAC_SECRET: "${IDENTITY_HMAC_SECRET}"
      IDENTITY_HMAC_MAX_AGE_MS: "${IDENTITY_HMAC_MAX_AGE_MS:-300000}"
      TRUST_IDENTITY_HEADERS: "false"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      LEAD_NOTIFICATIONS_ENABLED: "${LEAD_NOTIFICATIONS_ENABLED:-true}"
      LEAD_NOTIFICATION_FROM: "${LEAD_NOTIFICATION_FROM:-}"
      LEAD_NOTIFICATION_CC: "${LEAD_NOTIFICATION_CC:-}"
      LEAD_COCKPIT_URL: "${LEAD_COCKPIT_URL:-https://localengine.mondescale.com/leads}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
        NEXT_PUBLIC_SITE_ORIGIN: "${NEXT_PUBLIC_SITE_ORIGIN}"
        NEXT_PUBLIC_TENANT_SLUG: "${NEXT_PUBLIC_TENANT_SLUG:-mondescale}"
        NEXT_PUBLIC_SHOWCASE_URL: "${NEXT_PUBLIC_SHOWCASE_URL:-https://www.mondescale.com}"
    image: mondescale-marketing-frontend:mse-25-3
    container_name: mle_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - runtime
    environment:
      NODE_ENV: "production"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_BUSINESS_ACCOUNT_ID: "${GOOGLE_BUSINESS_ACCOUNT_ID}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"
      BASIC_AUTH_USERNAME: "${BASIC_AUTH_USERNAME}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD}"
      IDENTITY_HMAC_SECRET: "${IDENTITY_HMAC_SECRET}"
      BACKEND_INTERNAL_URL: "http://backend:4000"
      MONDESCALE_BACKEND_URL: "http://backend:4000"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL}"
      NEXT_PUBLIC_SITE_ORIGIN: "${NEXT_PUBLIC_SITE_ORIGIN}"
      PUBLIC_SITE_ORIGIN: "${PUBLIC_SITE_ORIGIN}"
      NEXT_PUBLIC_TENANT_SLUG: "${NEXT_PUBLIC_TENANT_SLUG:-mondescale}"
      TENANT_SLUG: "${TENANT_SLUG:-mondescale}"
      NEXT_PUBLIC_SHOWCASE_URL: "${NEXT_PUBLIC_SHOWCASE_URL:-https://www.mondescale.com}"
      INTERNAL_FRONTEND_URL: "http://localhost:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(v=>{if(v?.service!=='marketing-engine-frontend')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

networks:
  runtime:
    external: true
    name: "${MONDESCALE_RUNTIME_NETWORK:-mondescale-local-engine_default}"

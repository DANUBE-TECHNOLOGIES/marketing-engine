name: MSE-GEO V1.26 Network Agency Knowledge Bulk

on:
  pull_request:
    paths:
      - "backend/src/knowledge/network-agency-knowledge-bulk.service.js"
      - "backend/src/knowledge/network-agency-knowledge.service.js"
      - "backend/src/knowledge/network-geo.routes.js"
      - "backend/test/mse-geo-v1-26-network-agency-knowledge-bulk.test.js"
      - "frontend/app/knowledge/geo/network/agency-knowledge/page.js"
      - "frontend/test/mse-geo-v1-26-network-agency-knowledge-bulk.test.mjs"
      - ".github/workflows/mse-geo-v1-26-network-agency-knowledge-bulk.yml"
  workflow_dispatch:

jobs:
  backend-agency-knowledge-bulk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run bulk and inherited Agency Knowledge contracts
        run: node --test test/mse-geo-v1-26-network-agency-knowledge-bulk.test.js test/mse-geo-v1-25-network-agency-knowledge-matrix.test.js test/mse-geo-v1-24-agency-knowledge-bridge.test.js test/mse-geo-v1-23-network-explicit-expertise.test.js

  frontend-agency-knowledge-bulk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run bulk and inherited Agency Knowledge UI contracts
        run: node --test test/mse-geo-v1-26-network-agency-knowledge-bulk.test.mjs test/mse-geo-v1-25-network-agency-knowledge-matrix.test.mjs test/mse-geo-v1-23-network-explicit-expertise.test.mjs

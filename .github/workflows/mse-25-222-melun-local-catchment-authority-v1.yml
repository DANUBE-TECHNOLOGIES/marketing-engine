name: MSE-25.222 Melun Local Catchment Authority V1

on:
  pull_request:
    paths:
      - "backend/scripts/mse-25-222-melun-local-catchment-authority-v1.js"
      - "backend/test/mse-25-222-melun-local-catchment-authority-v1.test.js"
      - ".github/workflows/mse-25-222-melun-local-catchment-authority-v1.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MSE-25.222 regression tests
        run: node --test backend/test/mse-25-222-melun-local-catchment-authority-v1.test.js

name: MSE-25.210 Melun Local Authority V1

on:
  pull_request:
    paths:
      - "backend/scripts/mse-25-210-melun-local-authority-v1.js"
      - "backend/test/mse-25-210-melun-local-authority-v1.test.js"
      - ".github/workflows/mse-25-210-melun-local-authority-v1.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-25-210-melun-local-authority-v1.test.js

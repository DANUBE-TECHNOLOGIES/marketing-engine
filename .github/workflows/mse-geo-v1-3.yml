name: MSE-GEO V1.3 Knowledge Taxonomy

on:
  pull_request:
    paths:
      - "backend/src/knowledge/knowledge.constants.js"
      - "backend/src/knowledge/knowledge.validation.js"
      - "backend/src/knowledge/knowledge-relation.constants.js"
      - "backend/src/knowledge/knowledge-relation.validation.js"
      - "backend/test/mse-geo-v1-3-knowledge-taxonomy.test.js"
      - ".github/workflows/mse-geo-v1-3.yml"
  workflow_dispatch:

jobs:
  knowledge-taxonomy-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-geo-v1-3-knowledge-taxonomy.test.js

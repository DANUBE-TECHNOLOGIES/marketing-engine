name: MSE-25.91 canonical public reconvergence

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'scripts/mse-25-91-vm-deploy.sh'
      - 'scripts/mse-25-119-vm-deploy-main.test.mjs'
      - 'scripts/mse-25-91-post-validation-cleanup.sh'
      - 'scripts/mse-25-91-canonical-drift-check.js'
      - 'scripts/mse-25-124-runtime-verify.js'
      - '.github/workflows/mse-25-91.yml'

permissions:
  contents: read

jobs:
  canonical-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Canonical public drift guard
        run: node scripts/mse-25-91-canonical-drift-check.js

      - name: MSE-25.119 canonical deploy branch contract
        run: node --test scripts/mse-25-119-vm-deploy-main.test.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Canonical public regression tests
        working-directory: frontend
        run: |
          node --test test/mse-25-91-canonical-public-reconvergence.test.mjs
          node --test test/mse-25-85-sitemap-cache-safety.test.mjs
          node --test test/mse-25-152-geo-team-person-entities.test.mjs
          node --test test/mse-25-155-geo-institutional-reassurance-authority.test.mjs
          node --test test/mse-25-156-geo-legal-reassurance-runtime.test.mjs
          node --test test/mse-25-157-geo-payment-reassurance-authority.test.mjs
          node --test test/mse-25-158-geo-professional-affiliation-authority.test.mjs
          node --test test/mse-25-159-geo-faq-visible-schema-parity.test.mjs
          node --test test/mse-25-160-geo-faq-canonical-graph-linkage.test.mjs
          node --test test/mse-25-161-geo-canonical-webpage-semantic-consolidation.test.mjs
          node --test test/mse-25-162-geo-collection-webpage-consolidation.test.mjs
          node --test test/mse-25-163-geo-canonical-breadcrumb-linkage.test.mjs
          node --test test/mse-25-164-geo-destination-faq-parity-canonical-linkage.test.mjs
          node --test test/mse-25-165-geo-grounded-destination-metadata.test.mjs
          node --test test/mse-25-166-geo-area-served-visible-parity.test.mjs
          node --test test/mse-25-167-geo-grounded-local-context-copy.test.mjs
          node --test test/mse-25-168-geo-grounded-home-local-area-copy.test.mjs
          node --test test/mse-25-169-geo-canonical-team-person-identity.test.mjs
          node --test test/mse-25-170-geo-grounded-team-navigation.test.mjs
          node --test test/mse-25-171-geo-grounded-global-header.test.mjs
          node --test test/mse-25-172-geo-grounded-generic-section-fallbacks.test.mjs
          node --test test/mse-25-173-geo-grounded-global-footer.test.mjs
          node --test test/mse-25-174-geo-grounded-hero-fallbacks.test.mjs
          node --test test/mse-25-175-geo-grounded-cta-fallbacks.test.mjs

      - name: Lint canonical public files
        working-directory: frontend
        run: >-
          npx eslint
          app/agence/[siteSlug]/layout.js
          app/agence/[siteSlug]/[[...pageSlug]]/page.js
          app/agence/[siteSlug]/inspiration/page.js
          app/agence/[siteSlug]/destination/[destinationSlug]/page.js
          components/JsonLd.js
          components/destination/DestinationPage.js
          components/public-site/LocalContentContext.js
          components/public-site/LocalSeoAreaLinks.js
          components/public-site/PublicAgencyReferenceFacts.js
          components/public-site/PublicBrandLogo.js
          components/public-site/PublicReassuranceBand.js
          components/public-site/PublicContextualJourney.js
          components/public-site/PublicSiteHeader.js
          components/public-site/PublicSiteFooter.js
          components/public-site/PublicSiteSections.js
          components/public-site/renderers/HeroV2Renderer.js
          components/public-site/renderers/CtaV2Renderer.js
          components/public-site/renderers/TeamRenderer.js
          components/public-site/renderers/PartnersRenderer.js
          components/public-site/renderers/FaqRenderer.js
          components/public-site/renderers/DestinationsRenderer.js
          lib/public-faq.js
          lib/seo/canonical-jsonld.js
          lib/seo/collection-webpage-schema.js
          lib/seo/destination-faq-schema.js
          lib/seo/destination-public-collection.js
          lib/seo/local-area-config.js
          lib/seo/page-faq-schema.js
          lib/seo/page-semantics-schema.js
          lib/showcase-url.js

      - name: Build canonical public frontend
        working-directory: frontend
        run: npm run build

      - name: Setup backend dependencies
        working-directory: backend
        run: npm ci

      - name: MSE-25.124 Google review sync contract tests
        working-directory: backend
        run: |
          node --test test/mse-25-124-google-business-reviews.test.js
          node --test test/mse-25-151-google-review-summary-authority.test.js

      - name: MSE-25.91 public media contract tests
        working-directory: backend
        run: node --test test/mse-25-91-team-media-public-contract.test.js

      - name: MSE-25.86 preservation tests
        working-directory: backend
        run: |
          node --test test/mse-25-84-sitemap-transient-read-retry.test.js
          node --test test/mse-25-86-contact-seo-only.test.js
          node --test test/mse-25-86-seo-coverage-remediation.test.js
          node --test test/mse-25-86-vm-readiness.test.js

      - name: Validate guarded deployment scripts
        run: |
          bash -n scripts/mse-25-91-vm-deploy.sh
          bash -n scripts/mse-25-91-post-validation-cleanup.sh
          node --check scripts/mse-25-91-public-contract-preflight.js
          node --check scripts/mse-25-91-canonical-drift-check.js
          node --check scripts/mse-25-124-runtime-verify.js

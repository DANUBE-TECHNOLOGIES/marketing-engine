name: MSE-GEO V1.4 Knowledge Bridge

on:
  pull_request:
    paths:
      - "backend/src/modules/minisite-structured-data/person.js"
      - "backend/src/modules/minisite-structured-data/repository.js"
      - "backend/src/modules/minisite-structured-data/service.js"
      - "backend/test/mse-geo-v1-4-knowledge-bridge.test.js"
      - ".github/workflows/mse-geo-v1-4.yml"
  workflow_dispatch:

jobs:
  geo-v1-4-backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-geo-v1-4-knowledge-bridge.test.js test/mse-geo-v1-2-person-graph.test.js

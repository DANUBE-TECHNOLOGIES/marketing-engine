name: MSE-25.223 Melun Trust Decision Authority V1

on:
  pull_request:
    paths:
      - "backend/scripts/mse-25-223-melun-trust-decision-authority-v1.js"
      - "backend/test/mse-25-223-melun-trust-decision-authority-v1.test.js"
      - ".github/workflows/mse-25-223-melun-trust-decision-authority-v1.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MSE-25.223 regression tests
        run: node --test backend/test/mse-25-223-melun-trust-decision-authority-v1.test.js

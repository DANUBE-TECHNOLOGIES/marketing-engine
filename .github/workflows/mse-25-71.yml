name: MSE-25.71 Public Performance P0

on:
  push:
    branches:
      - 'feature/mse-25-71-*'
    paths:
      - 'frontend/app/agence/**'
      - 'frontend/components/public-site/**'
      - 'frontend/lib/public-site-api.js'
      - 'frontend/lib/public-brand-legal-runtime.js'
      - 'frontend/test/mse-25-71-*.test.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/mse-25-71.yml'
  pull_request:
    paths:
      - 'frontend/app/agence/**'
      - 'frontend/components/public-site/**'
      - 'frontend/lib/public-site-api.js'
      - 'frontend/lib/public-brand-legal-runtime.js'
      - 'frontend/test/mse-25-71-*.test.mjs'
      - '.github/workflows/mse-25-71.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: MSE-25.71 performance contract
        working-directory: frontend
        run: node --test test/mse-25-71-public-performance-p0.test.mjs

      - name: Build public frontend
        working-directory: frontend
        run: npm run build

name: MSE 25.21 partner editor patch

on:
  push:
    branches:
      - feature/mse-25-21-common-partners-foundation
    paths:
      - .github/workflows/mse-25-21-partner-editor-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mse-25-21-common-partners-foundation
          fetch-depth: 0

      - name: Wire PartnerLogosEditor into VisualPageBuilder
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/components/page-builder-v2/VisualPageBuilder.js")
          source = path.read_text(encoding="utf-8")

          import_anchor = '''  GalleryEditor,\n  StringListEditor,'''
          import_replacement = '''  GalleryEditor,\n  PartnerLogosEditor,\n  StringListEditor,'''
          if import_anchor not in source:
              raise SystemExit("Partner editor import anchor not found")
          source = source.replace(import_anchor, import_replacement, 1)

          editor_anchor = '''      {block.type === "testimonials" &&\n      content.source === "manual" ? ('''
          editor_block = '''      {block.type === "partner-logos" ? (\n        <PartnerLogosEditor\n          networkItems={content.items}\n          agencyPartners={content.agencyPartners}\n          maxAgencyPartners={Number(content.maxAgencyPartners) || 3}\n          onChange={(agencyPartners) =>\n            set("agencyPartners", agencyPartners)\n          }\n        />\n      ) : null}\n\n'''
          if editor_anchor not in source:
              raise SystemExit("Partner editor insertion anchor not found")
          source = source.replace(editor_anchor, editor_block + editor_anchor, 1)

          preview_anchor = '''    case "testimonials":\n      return ('''
          preview_block = '''    case "partner-logos":\n      return (\n        <section className={styles.contentPreview}>\n          <h2>{content.title || "Les plus grands voyagistes, un seul conseiller"}</h2>\n          {content.text ? <p>{content.text}</p> : null}\n          <div className={styles.partnerPreview}>\n            {(content.items || []).map((item, index) => (\n              <span key={item.id || item.name || index}>\n                {item.name || item.title}\n              </span>\n            ))}\n            {(content.agencyPartners || []).slice(0, Number(content.maxAgencyPartners) || 3).map((item, index) => (\n              <span key={item.id || item.name || `agency-${index}`}>\n                {item.name || "Partenaire agence"}\n              </span>\n            ))}\n          </div>\n        </section>\n      );\n\n'''
          if preview_anchor not in source:
              raise SystemExit("Partner preview insertion anchor not found")
          source = source.replace(preview_anchor, preview_block + preview_anchor, 1)

          path.write_text(source, encoding="utf-8")

      - name: Add partner editor styles
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/components/page-builder-v2/VisualPageBuilder.module.css")
          source = path.read_text(encoding="utf-8")
          marker = "/* mse-25-21-partner-editor */"
          if marker not in source:
              source += '''\n\n/* mse-25-21-partner-editor */\n.partnerEditor {\n  margin-top: 20px;\n  display: grid;\n  gap: 18px;\n}\n\n.partnerLockedPanel {\n  padding: 14px;\n  border: 1px solid #dfe4eb;\n  border-radius: 12px;\n  background: #f7f9fc;\n}\n\n.partnerLockedPanel > p {\n  margin: 6px 0 12px;\n  color: #667287;\n  font-size: 12px;\n  line-height: 1.5;\n}\n\n.partnerLockedList,\n.partnerPreview {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 7px;\n}\n\n.partnerLockedList span,\n.partnerPreview span {\n  padding: 6px 9px;\n  border: 1px solid #dce3ec;\n  border-radius: 999px;\n  background: #fff;\n  color: #40506a;\n  font-size: 11px;\n  font-weight: 700;\n}\n\n.partnerAgencyHeader {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 10px;\n}\n\n.partnerAgencyHeader small {\n  color: #758299;\n  font-size: 11px;\n}\n'''
              path.write_text(source, encoding="utf-8")

      - name: Verify patch
        run: |
          grep -q 'PartnerLogosEditor' frontend/components/page-builder-v2/VisualPageBuilder.js
          grep -q 'block.type === "partner-logos"' frontend/components/page-builder-v2/VisualPageBuilder.js
          grep -q 'mse-25-21-partner-editor' frontend/components/page-builder-v2/VisualPageBuilder.module.css

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/page-builder-v2/VisualPageBuilder.js frontend/components/page-builder-v2/VisualPageBuilder.module.css
          git rm .github/workflows/mse-25-21-partner-editor-patch.yml
          git commit -m "feat(partners): wire protected agency partner editor"
          git push origin HEAD:feature/mse-25-21-common-partners-foundation

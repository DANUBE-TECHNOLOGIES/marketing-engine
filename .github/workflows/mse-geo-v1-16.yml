name: MSE-GEO V1.16 Network Rollout

on:
  pull_request:
    paths:
      - "backend/src/knowledge/network-geo.service.js"
      - "backend/src/knowledge/network-geo.routes.js"
      - "backend/src/knowledge/knowledge.routes.js"
      - "backend/test/mse-geo-v1-16-network-rollout.test.js"
      - "frontend/app/knowledge/geo/network/page.js"
      - "frontend/test/mse-geo-v1-16-network-rollout.test.mjs"
      - ".github/workflows/mse-geo-v1-16.yml"

jobs:
  backend-network-rollout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run network GEO contracts
        run: node --test test/mse-geo-v1-16-network-rollout.test.js

  frontend-network-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run network GEO dashboard contract
        run: node --test test/mse-geo-v1-16-network-rollout.test.mjs

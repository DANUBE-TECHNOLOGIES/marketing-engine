name: MSE-25.219 Melun Conversion Reassurance V1

on:
  pull_request:
    paths:
      - "backend/scripts/mse-25-219-melun-conversion-reassurance-v1.js"
      - "backend/test/mse-25-219-melun-conversion-reassurance-v1.test.js"
      - ".github/workflows/mse-25-219-melun-conversion-reassurance-v1.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run MSE-25.219 regression contract
        run: node --test backend/test/mse-25-219-melun-conversion-reassurance-v1.test.js

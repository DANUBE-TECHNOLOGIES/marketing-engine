name: MSE-GEO V1.13 Maurepas Pilot Admin

on:
  pull_request:
    paths:
      - "frontend/app/knowledge/page.js"
      - "frontend/app/knowledge/pilots/maurepas/page.js"
      - "frontend/test/mse-geo-v1-13-maurepas-pilot-admin.test.mjs"
      - ".github/workflows/mse-geo-v1-13.yml"

jobs:
  pilot-admin-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-geo-v1-13-maurepas-pilot-admin.test.mjs

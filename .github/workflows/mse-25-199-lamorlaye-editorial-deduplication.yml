name: MSE-25.199 Lamorlaye Editorial Deduplication V1

on:
  pull_request:
    paths:
      - "backend/scripts/mse-25-199-lamorlaye-editorial-deduplication.js"
      - "backend/test/mse-25-199-lamorlaye-editorial-deduplication.test.js"
      - ".github/workflows/mse-25-199-lamorlaye-editorial-deduplication.yml"

jobs:
  lamorlaye-editorial-deduplication-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check backend/scripts/mse-25-199-lamorlaye-editorial-deduplication.js
      - name: Contract test
        run: node --test backend/test/mse-25-199-lamorlaye-editorial-deduplication.test.js

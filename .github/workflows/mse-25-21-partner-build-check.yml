name: MSE 25.21 partner build check

on:
  push:
    branches:
      - feature/mse-25-21-common-partners-foundation
    paths:
      - .github/workflows/mse-25-21-partner-build-check.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mse-25-21-common-partners-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Remove temporary workflow after success
        if: success()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mse-25-21-partner-build-check.yml
          git commit -m "chore(ci): remove partner build check"
          git push origin HEAD:feature/mse-25-21-common-partners-foundation

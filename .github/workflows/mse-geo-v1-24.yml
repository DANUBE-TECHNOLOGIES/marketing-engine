name: MSE-GEO V1.24 Agency Knowledge Bridge

on:
  pull_request:
    paths:
      - "backend/src/modules/minisite-structured-data/agency-knowledge.js"
      - "backend/src/modules/minisite-structured-data/repository.js"
      - "backend/src/modules/minisite-structured-data/service.js"
      - "backend/src/modules/minisite-structured-data/planner.js"
      - "backend/src/modules/minisite-structured-data/entity-facts.js"
      - "backend/test/mse-geo-v1-24-agency-knowledge-bridge.test.js"
      - ".github/workflows/mse-geo-v1-24.yml"
  workflow_dispatch:

jobs:
  agency-knowledge-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run Agency Knowledge bridge and inherited public GEO contracts
        run: node --test test/mse-geo-v1-24-agency-knowledge-bridge.test.js test/mse-geo-v1-22-public-entity-facts.test.js test/mse-geo-v1-21-network-public-readiness.test.js test/mse-geo-v1-20-network-team-link.test.js test/mse-geo-v1-19-network-person-apply.test.js test/mse-geo-v1-18-network-person-reconciliation.test.js test/mse-geo-v1-17-network-agency-apply.test.js test/mse-geo-v1-16-network-rollout.test.js

name: MSE-25.322 FRAM validation
on:
  pull_request:
    paths:
      - 'backend/src/modules/ambassade-fram/**'
      - 'backend/test/mse-25-322-*.test.js'
      - 'backend/prisma/**'
      - 'backend/package*.json'
      - '.github/workflows/mse-25-322-fram.yml'
  workflow_dispatch:
jobs:
  fram-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://fram:fram@localhost:5432/fram?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: node --test test/mse-25-322-*.test.js

name: MSE-GEO V1.6 Team Editor

on:
  pull_request:
    paths:
      - "frontend/lib/website-builder/inspector-registry.js"
      - "frontend/test/mse-geo-v1-6-team-editor.test.mjs"
      - ".github/workflows/mse-geo-v1-6-team-editor.yml"

jobs:
  team-editor-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MSE-GEO V1.6 contract
        working-directory: frontend
        run: node --test test/mse-geo-v1-6-team-editor.test.mjs

name: MSE-GEO V1.8 Maurepas Knowledge Pilot

on:
  pull_request:
    paths:
      - "backend/src/knowledge/pilot-planner.js"
      - "backend/src/knowledge/pilots/maurepas.manifest.js"
      - "backend/test/mse-geo-v1-8-maurepas-knowledge-pilot.test.js"
      - ".github/workflows/mse-geo-v1-8-maurepas-knowledge-pilot.yml"
  workflow_dispatch:

jobs:
  dry-run-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-geo-v1-8-maurepas-knowledge-pilot.test.js

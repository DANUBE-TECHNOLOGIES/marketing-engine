name: MSE-GEO V1.27 Network Coverage

on:
  pull_request:
    paths:
      - "backend/src/knowledge/network-coverage.service.js"
      - "backend/src/knowledge/network-geo.routes.js"
      - "backend/test/mse-geo-v1-27-network-coverage.test.js"
      - "frontend/app/knowledge/geo/network/coverage/page.js"
      - "frontend/app/knowledge/geo/network/layout.js"
      - "frontend/test/mse-geo-v1-27-network-coverage.test.mjs"
      - ".github/workflows/mse-geo-v1-27-network-coverage.yml"

jobs:
  backend-network-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run coverage and inherited Knowledge contracts
        working-directory: backend
        run: node --test test/mse-geo-v1-27-network-coverage.test.js test/mse-geo-v1-26-network-agency-knowledge-bulk.test.js test/mse-geo-v1-25-network-agency-knowledge-matrix.test.js test/mse-geo-v1-23-network-explicit-expertise.test.js

  frontend-network-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run coverage and inherited UI contracts
        working-directory: frontend
        run: node --test test/mse-geo-v1-27-network-coverage.test.mjs test/mse-geo-v1-26-network-agency-knowledge-bulk.test.mjs test/mse-geo-v1-25-network-agency-knowledge-matrix.test.mjs test/mse-geo-v1-23-network-explicit-expertise.test.mjs

name: MSE-25.125BR Maurepas catchment

on:
  pull_request:
    paths:
      - 'frontend/lib/seo/local-area-config.js'
      - 'frontend/test/mse-25-125-maurepas-local-expansion.test.mjs'
      - '.github/workflows/mse-25-125br-maurepas-catchment.yml'
  push:
    paths:
      - 'frontend/lib/seo/local-area-config.js'
      - 'frontend/test/mse-25-125-maurepas-local-expansion.test.mjs'
      - '.github/workflows/mse-25-125br-maurepas-catchment.yml'

jobs:
  maurepas-catchment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Maurepas local catchment contract
        run: node --test test/mse-25-125-maurepas-local-expansion.test.mjs

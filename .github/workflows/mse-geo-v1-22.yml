name: MSE-GEO V1.22 Public Entity Facts

on:
  pull_request:
    paths:
      - "backend/src/modules/minisite-structured-data/entity-facts.js"
      - "backend/src/modules/minisite-structured-data/routes.js"
      - "backend/test/mse-geo-v1-22-public-entity-facts.test.js"
      - ".github/workflows/mse-geo-v1-22.yml"

jobs:
  entity-facts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run public Entity Facts and inherited GEO contracts
        run: node --test test/mse-geo-v1-22-public-entity-facts.test.js test/mse-geo-v1-21-network-public-readiness.test.js test/mse-geo-v1-20-network-team-link.test.js test/mse-geo-v1-19-network-person-apply.test.js test/mse-geo-v1-18-network-person-reconciliation.test.js test/mse-geo-v1-17-network-agency-apply.test.js test/mse-geo-v1-16-network-rollout.test.js

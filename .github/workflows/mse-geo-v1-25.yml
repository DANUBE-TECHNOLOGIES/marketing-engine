name: MSE-GEO V1.25 Network Agency Knowledge Matrix

on:
  pull_request:
    paths:
      - "backend/src/knowledge/network-agency-knowledge.service.js"
      - "backend/src/knowledge/network-geo.routes.js"
      - "backend/test/mse-geo-v1-25-network-agency-knowledge-matrix.test.js"
      - "frontend/app/knowledge/geo/network/agency-knowledge/page.js"
      - "frontend/app/knowledge/geo/network/layout.js"
      - "frontend/test/mse-geo-v1-25-network-agency-knowledge-matrix.test.mjs"
      - ".github/workflows/mse-geo-v1-25.yml"
  workflow_dispatch:

jobs:
  backend-agency-knowledge-matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run Agency matrix and inherited GEO contracts
        run: node --test test/mse-geo-v1-25-network-agency-knowledge-matrix.test.js test/mse-geo-v1-24-agency-knowledge-bridge.test.js test/mse-geo-v1-23-network-explicit-expertise.test.js test/mse-geo-v1-22-public-entity-facts.test.js test/mse-geo-v1-21-network-public-readiness.test.js test/mse-geo-v1-20-network-team-link.test.js

  frontend-agency-knowledge-matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Agency matrix and network UI contracts
        run: node --test test/mse-geo-v1-25-network-agency-knowledge-matrix.test.mjs test/mse-geo-v1-23-network-explicit-expertise.test.mjs test/mse-geo-v1-21-network-public-readiness.test.mjs

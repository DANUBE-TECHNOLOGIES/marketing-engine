name: MSE-GEO V1.12 Maurepas Pilot API

on:
  pull_request:
    paths:
      - "backend/src/knowledge/maurepas-pilot.service.js"
      - "backend/src/knowledge/maurepas-pilot.routes.js"
      - "backend/src/knowledge/knowledge.routes.js"
      - "backend/test/mse-geo-v1-12-maurepas-pilot-api.test.js"
      - ".github/workflows/mse-geo-v1-12.yml"

jobs:
  pilot-api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-geo-v1-12-maurepas-pilot-api.test.js test/mse-geo-v1-9-controlled-knowledge-apply.test.js test/mse-geo-v1-10-explicit-apply-approval.test.js

name: MSE-GEO V1.34 Agent Knowledge Gap Feedback

on:
  pull_request:
    paths:
      - "backend/src/knowledge/agent-knowledge-gaps.service.js"
      - "backend/src/knowledge/network-geo.routes.js"
      - "backend/test/mse-geo-v1-34-agent-gap-feedback.test.js"
      - "frontend/app/knowledge/geo/network/**"
      - "frontend/test/mse-geo-v1-34-agent-gap-feedback.test.mjs"
      - ".github/workflows/mse-geo-v1-34-agent-gap-feedback.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-geo-v1-34-agent-gap-feedback.test.js

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test test/mse-geo-v1-34-agent-gap-feedback.test.mjs
